# Enable only after Certbot has issued the paperknow.cn certificate.
# Replaces nginx-http.conf at /etc/nginx/sites-available/paperknow.conf.
server {
    listen 80;
    listen [::]:80;
    server_name paperknow.cn www.paperknow.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/paperknow-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://paperknow.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.paperknow.cn;

    ssl_certificate /etc/letsencrypt/live/paperknow.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paperknow.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PaperKnowTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 308 https://paperknow.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name paperknow.cn;

    ssl_certificate /etc/letsencrypt/live/paperknow.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paperknow.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PaperKnowTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/paperknow.access.log;
    error_log /var/log/nginx/paperknow.error.log;

    client_max_body_size 3m;
    client_header_timeout 15s;
    client_body_timeout 120s;
    send_timeout 120s;

    # Generated exports have a separate authenticated, bounded upload API.
    # Streaming the request avoids persistent Nginx body temp files for large exports.
    location = /api/artifacts {
        client_max_body_size 28m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ^~ /api/artifacts/ {
        proxy_buffering off;
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
