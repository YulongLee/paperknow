# Initial HTTP site for connectivity checks and ACME certificate issuance.
# Install as /etc/nginx/sites-available/paperknow.conf; replace with
# nginx-https.conf after the certificate exists. Do not enable both templates.
server {
    listen 80;
    listen [::]:80;
    server_name paperknow.cn www.paperknow.cn;

    access_log /var/log/nginx/paperknow.access.log;
    error_log /var/log/nginx/paperknow.error.log;

    # Application limits: JSON <= 3 MiB (a file <= 2 MiB before base64).
    client_max_body_size 3m;
    client_header_timeout 15s;
    client_body_timeout 120s;
    send_timeout 120s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/paperknow-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Preserve the browser's Host for the application's Origin check.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # This Nginx is the public edge: replace client-supplied IP headers.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
